<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Malica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="home">
    <div class = "navbar">
        <a href="/menu"><img src="/static/photos/logo2.png" alt="logo"></a>
        <h1>Welcome to Malica</h1>
        <button class="logout"><a href="/logout">Log out</a></button>
    </div>
    <div class="main">
    {% include 'menu.html' %}
    <div class="glavni-del">
       <div class="description"> 
         <h2>Your Friend Requests</h2>
        <p>Here you can see all your friend requests and manage them.</p>
       </div>
        <div class="spaces">
            <div class="space-list">
                {% for requester in requesters %}
                <div class="space-item">
                    <h3>{{ requester.username }}</h3>
                    <p>Email: {{ requester.email }}</p>
                    <button><a href="/accept_friend_request/{{ requester.id }}">Accept Request</a></button>
                    <button><a href="/decline_friend_request/{{ requester.id }}">Decline Request</a></button>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
